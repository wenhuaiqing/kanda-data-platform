# Data contract: the roster.
id: rostering.shifts
source: Rostering system
owner: Rostering and coordination
steward: Data platform team
schedule: nightly 02:30, the month to date
freshness_hours: 26
key: [shift_id]
consumers:
  - team: Finance (claiming)
    needs: The service as planned - client, worker, item, times and rate - to build the claim from
  - team: Coordinators
    needs: Their region's services and what is holding any of them
classification: Internal.
versions:
  - version: 1
    status: approved
    effective_from: 2026-07-01
    approved_by: Rostering, Finance
    fields:
      shift_id:      {type: string, required: true, pattern: "^SH-\\d{6}$", class: internal}
      client_id:     {type: string, required: true, class: internal}
      worker_id:     {type: string, required: true, pattern: "^W\\d{4}$", class: internal}
      item_code:     {type: string, required: true, class: internal}
      start_local:   {type: timestamp, required: true, class: internal}
      end_local:     {type: timestamp, required: true, class: internal}
      rate_per_hour: {type: money, required: true, min_exclusive: 0, class: internal}
      status:        {type: string, required: true, class: internal, values: [scheduled, client_cancelled]}
      cancelled_at:  {type: timestamp, required: false, class: internal}
rules:
  - id: end_after_start
    what: A shift ends after it starts.
  - id: item_in_catalogue
    what: The item code is in the support catalogue.
